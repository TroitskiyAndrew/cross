<main class="game-shell">
  <section class="game-panel" aria-label="Игра крестики-нолики">
    <h1>Крестики-нолики</h1>

    <p class="status">Ходит: {{ currentPlayer }}</p>

    <div class="board" role="grid" aria-label="Игровое поле 3 на 3">
      <button
        *ngFor="let cell of board; let i = index"
        class="cell"
        type="button"
        [attr.aria-label]="'Клетка ' + (i + 1)"
        [class.x]="cell === 'X'"
        [class.o]="cell === 'O'"
        (click)="handleCellClick(i)"
      >
        {{ cell }}
      </button>
    </div>
  </section>
</main>
